services:
  postgres:
    image: postgres:16-alpine
    container_name: solicitacoes-trade-postgres
    environment:
      POSTGRES_DB: solicitacoes_trade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/Fortaleza
    ports:
      - "5432:5432"
    volumes:
      - solicitacoes_trade_pg:/var/lib/postgresql/data

volumes:
  solicitacoes_trade_pg:
